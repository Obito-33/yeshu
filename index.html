<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>தமிழ் பசங்க VTC</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Tamil:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><span class="logo">VTC</span></header>
<main>
  <h1>தமிழ் பசங்க <mark>VTC</mark></h1>
  <p>நம்ம பசங்க செய்த AI வீடியோக்கள் ஒரே இடத்தில்.</p>

  <form id="form">
    <input type="file" id="file" accept="video/*" required>
    <input type="text" id="title" placeholder="தலைப்பு" required maxlength="80">
    <input type="text" id="creator" placeholder="உன் பெயர்" maxlength="40">
    <select id="tool">
      <option>Sora</option><option>Veo</option><option>Runway</option>
      <option>Kling</option><option>Pika</option><option>Midjourney</option><option>Other</option>
    </select>
    <button class="btn" id="btn" type="submit">பதிவேற்று</button>
  </form>

  <h2>AI வீடியோக்கள்</h2>
  <div id="grid" class="grid"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="script.js"></script>
</body>
</html>
